<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lustria&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#000000">
    <title>Marta Lendinez — Portfolio</title>
    <link rel="icon" href="/icons/favicon.ico" />

  </head>

  <body>
    <!-- Boot screen (shows BEFORE React loads), macOS style -->
    <div id="boot-splash" aria-label="Loading Marta’s portfolio" role="status">
      <svg class="boot-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
      </svg>
      <div class="boot-progress" aria-hidden="true"><div class="boot-progress-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        background: #000;
        color: #fff;
        transition: opacity 450ms ease;
      }
      .boot-logo {
        width: 76px;
        height: 76px;
        opacity: 0;
        animation: bootfade 400ms ease 150ms forwards;
      }
      .boot-progress {
        width: 200px;
        height: 5px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.25);
        opacity: 0;
        animation: bootfade 400ms ease 250ms forwards;
      }
      .boot-progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: #fff;
        /* fills quickly to ~85%, then React completes it */
        animation: bootfill 1.4s cubic-bezier(0.45, 0, 0.2, 1) 300ms forwards;
      }
      #boot-splash.boot-done .boot-progress-fill {
        width: 100% !important;
        animation: none;
        transition: width 260ms ease-out;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bootfade { to { opacity: 1; } }
      @keyframes bootfill { to { width: 85%; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-progress { animation: none; opacity: 1; }
        .boot-progress-fill { animation: none; width: 85%; }
      }
    </style>
  </body>
</html>
