    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        background: #000;
        color: #fff;
        transition: opacity 450ms ease;
      }
      .boot-logo {
        width: 76px;
        height: 76px;
        opacity: 0;
        animation: bootfade 400ms ease 150ms forwards;
      }
      .boot-progress {
        width: 200px;
        height: 5px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.25);
        opacity: 0;
        animation: bootfade 400ms ease 250ms forwards;
      }
      .boot-progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: #fff;
        /* fills quickly to ~85%, then React completes it */
        animation: bootfill 1.4s cubic-bezier(0.45, 0, 0.2, 1) 300ms forwards;
      }
      #boot-splash.boot-done .boot-progress-fill {
        width: 100% !important;
        animation: none;
        transition: width 260ms ease-out;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bootfade { to { opacity: 1; } }
      @keyframes bootfill { to { width: 85%; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-progress { animation: none; opacity: 1; }
        .boot-progress-fill { animation: none; width: 85%; }
      }
    </style>
